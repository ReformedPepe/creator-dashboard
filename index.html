<!doctype html>
<html lang="pl">
  <head>
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('creator-dashboard-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldBeDark = pref === 'dark' || (pref !== 'light' && prefersDark);
          if (shouldBeDark) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard do śledzenia wyświetleń filmów z YouTube i TikTok" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
    <title>Creator Stats Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
